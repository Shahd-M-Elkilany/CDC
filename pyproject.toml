[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc"
version = "0.1.0"
description = "License-free Concurrent Design Center for Earth-observation mission design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "altair>=5.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
cdc = "cdc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130   # parameter tables read best as one row per parameter
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
