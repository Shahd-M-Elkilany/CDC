name: python
on:
  push:
    paths: ["python/**", "reference/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "reference/**", ".github/workflows/python.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests examples
      - run: python -m pytest -q
      - name: Example script and figure run headless
        env:
          MPLBACKEND: Agg
        run: |
          python examples/solar_figure.py
          python -m cdc snr --plot
